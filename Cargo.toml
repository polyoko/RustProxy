[package]
name = "rust_proxy"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_proxy"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust_proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
dashmap = "5.5"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.4", features = ["derive"] }
inquire = "0.6"
colored = "2.0"
lazy_static = "1.4"
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = "0.14.1"
base64 = "0.22"
rcgen = "0.13.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tokio-rustls = "0.26"
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.13"

[features]
default = []
